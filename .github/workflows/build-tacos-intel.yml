name: Build VoxelCore macOS Intel

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-macos-intel:
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew update
          brew install \
            cmake ninja pkg-config \
            glfw glew glm libpng libvorbis \
            lua luajit libcurl openal-soft freetype \
            openssl@3

      - name: Configure project
        shell: bash
        run: |
          set -euxo pipefail
          export PKG_CONFIG_PATH="$(brew --prefix)/opt/openssl@3/lib/pkgconfig:$(brew --prefix)/opt/luajit/lib/pkgconfig:$PKG_CONFIG_PATH"
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix openssl@3)" \
            ..

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel

      - name: Check output
        shell: bash
        run: |
          set -euxo pipefail
          ls -l build/VoxelCore
          ls -ld build/res

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelcore-macos-intel-x86_64
          path: build
          if-no-files-found: error
